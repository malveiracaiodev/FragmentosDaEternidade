<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Fundo escuro opcional para destacar o neon (pode remover se preferir transparente) -->
  <rect width="100" height="100" rx="20" fill="#000000"/>
  
  <!-- Hexágono Externo mais sutil -->
  <polygon points="50,10 85,30 85,70 50,90 15,70 15,30" fill="none" stroke="#06b6d4" stroke-width="4" stroke-opacity="0.4"/>

  <!-- O "M" Central com brilho -->
  <path d="M 30,70 L 30,35 L 50,55 L 70,35 L 70,70" fill="none" stroke="#00f3ff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" style="filter: drop-shadow(0px 0px 6px rgba(0,243,255,0.8));"/>
  
  <!-- Pontos de solda (nós) -->
  <circle cx="30" cy="70" r="4" fill="#00f3ff"/>
  <circle cx="50" cy="55" r="4" fill="#00f3ff"/>
  <circle cx="70" cy="70" r="4" fill="#00f3ff"/>
</svg>
