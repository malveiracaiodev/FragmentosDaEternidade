
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 64 64"
     width="64" height="64">

  <defs>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#00eaff" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#007bff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="flame" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#003b9e"/>
      <stop offset="45%" stop-color="#007cff"/>
      <stop offset="100%" stop-color="#65f5ff"/>
    </linearGradient>

    <linearGradient id="core" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#00aaff"/>
      <stop offset="100%" stop-color="#d9ffff"/>
    </linearGradient>

    <filter id="light" x="-80%" y="-80%"
            width="260%" height="260%">
      <feGaussianBlur stdDeviation="3"
                      result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Brilho externo -->
  <circle cx="32" cy="34" r="28" fill="url(#glow)">
    <animate attributeName="opacity"
             values=".55;1;.55"
             dur="2s"
             repeatCount="indefinite"/>
  </circle>

  <!-- Chama principal -->
  <g filter="url(#light)">
    <path fill="url(#flame)"
      d="M32 3
         C34 14 47 19 48 32
         C57 45 46 60 32 61
         C17 62 7 51 12 37
         C15 27 24 22 23 12
         C29 17 30 23 29 28
         C37 22 35 12 32 3Z">
      <animateTransform
        attributeName="transform"
        type="scale"
        values="1 1;1.04 .97;1 1"
        dur="1.5s"
        repeatCount="indefinite"
        additive="sum"/>
    </path>

    <!-- Núcleo luminoso -->
    <path fill="url(#core)"
      d="M32 27
         C36 34 41 39 38 48
         C36 55 27 57 22 50
         C18 44 25 37 28 33
         C29 39 32 40 32 27Z">
      <animate attributeName="opacity"
               values=".8;1;.8"
               dur="1.2s"
               repeatCount="indefinite"/>
    </path>
  </g>
</svg>
