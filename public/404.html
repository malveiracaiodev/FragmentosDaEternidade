<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Fragmentos da Eternidade</title>
    <!-- Script que redireciona a rota atual para a raiz mantendo o caminho original na URL -->
    <script type="text/javascript">
      var segmentCount = 1; // Ajuste para 1 se o seu repositório for /FragmentosDaEternidade/ (conta o nome do repo como 1 segmento)
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?p=/' +
        l.pathname.slice(1).split('/').slice(segmentCount).join('/') +
        (l.search ? '&q=' + l.pathname.slice(1) : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
